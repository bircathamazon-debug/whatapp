<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>המספרה של יעקב | Peluquería de Yaacob</title>
<meta name="description" content="המספרה של יעקב — תספורות בירושלים. קביעת תור בוואטסאפ, בלי להמתין." />
<style>
  :root {
    --bg: #f8f6f2;
    --surface: #ffffff;
    --surface-muted: #f0ece4;
    --border: #e7e1d6;
    --text: #211d19;
    --text-muted: #8a8276;
    --accent: #00b4d8;
    --accent-soft: #dcf4f8;
    --success: #0fa568;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .shell {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    box-shadow: 0 0 40px rgba(0,0,0,0.06);
  }
  header {
    padding: 48px 24px 32px;
    text-align: center;
  }
  .badge {
    width: 72px;
    height: 72px;
    margin: 0 auto 16px;
    border-radius: 28px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    box-shadow: 0 10px 24px rgba(0,180,216,0.35);
  }
  h1 {
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 4px;
    letter-spacing: -0.3px;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 15px;
    margin: 0;
  }
  main {
    padding: 0 20px 40px;
  }
  section {
    background: var(--surface);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1.5px solid var(--accent-soft);
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
  }
  section h2 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text-muted);
    margin: 0 0 12px;
  }
  .service-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
  }
  .service-name { font-weight: 700; font-size: 16px; }
  .service-price { font-weight: 800; color: var(--accent); font-size: 16px; }
  .hours-row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    font-size: 14.5px;
    border-bottom: 1px solid var(--surface-muted);
  }
  .hours-row:last-child { border-bottom: none; }
  .hours-day { color: var(--text); font-weight: 600; }
  .hours-time { color: var(--text-muted); }
  .hours-closed { color: var(--text-muted); font-style: italic; }
  .cta {
    display: block;
    text-align: center;
    background: var(--success);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    padding: 16px;
    border-radius: 999px;
    box-shadow: 0 10px 24px rgba(15,165,104,0.3);
  }
  .cta-secondary {
    display: block;
    text-align: center;
    background: var(--accent-soft);
    color: var(--accent);
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    padding: 13px;
    border-radius: 999px;
    margin-top: 10px;
  }
  .location-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14.5px;
    color: var(--text);
  }
  footer {
    text-align: center;
    padding: 24px;
    color: var(--text-muted);
    font-size: 12.5px;
  }
</style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="badge">✂️</div>
      <h1>המספרה של יעקב</h1>
      <p class="subtitle">תספורות בירושלים — קביעת תור בוואטסאפ</p>
    </header>

    <main>
      <section>
        <h2>שירותים</h2>
        <div class="service-row">
          <span class="service-name">✂️ תספורת</span>
          <span class="service-price">₪60</span>
        </div>
      </section>

      <section>
        <h2>שעות פעילות</h2>
        <div class="hours-row"><span class="hours-day">ראשון–חמישי</span><span class="hours-time">09:00–19:00</span></div>
        <div class="hours-row"><span class="hours-day">שישי</span><span class="hours-time">09:00–14:00</span></div>
        <div class="hours-row"><span class="hours-day">שבת</span><span class="hours-closed">סגור</span></div>
      </section>

      <section>
        <h2>מיקום</h2>
        <div class="location-line">📍 ירושלים</div>
      </section>

      <section>
        <h2>קביעת תור</h2>
        <a class="cta" href="https://wa.me/972533981227?text=%D7%94%D7%99%D7%99%2C%20%D7%90%D7%A9%D7%9E%D7%97/%D7%94%20%D7%9C%D7%A7%D7%91%D7%95%D7%A2%20%D7%AA%D7%95%D7%A8" target="_blank" rel="noopener">💬 קביעת תור בוואטסאפ</a>
      </section>
    </main>

    <footer>
      המספרה של יעקב · ירושלים
    </footer>
  </div>
</body>
</html>
